# Render Blueprint: Dashboard → New → Blueprint → pick this repo.
# Creates the Postgres database and the web service, generates the secrets,
# and asks you for APP_URL once (your https://<name>.onrender.com).
databases:
  - name: agentsdr-db
    databaseName: agentsdr
    user: agentsdr
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  - type: web
    name: agentsdr
    # Built from this repo's Dockerfile; every push to main redeploys.
    runtime: docker
    dockerfilePath: ./Dockerfile
    branch: main
    autoDeploy: true
    # Standard (2 GB): the app idles around 650 MB, over Starter's 512 MB.
    # Not free either: free services sleep, and the scheduled jobs run inside the app.
    plan: standard
    envVars:
      - key: APP_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: agentsdr-db
          property: connectionString
      # The internal Render network URL has no TLS.
      - key: DATABASE_SSL
        value: disable
      - key: BETTER_AUTH_SECRET
        generateValue: true
      # Back this one up: it decrypts every saved integration credential.
      - key: INTEGRATION_CREDENTIALS_KEY
        generateValue: true
      - key: UNSUBSCRIBE_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: AUTH_EMAIL_FROM
        sync: false
